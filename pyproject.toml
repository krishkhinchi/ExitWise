[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exitwise"
version = "0.1.0"
description = "Gemma 4 powered Dependency Exit Capsule generator — AI proposes, machine verifies"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Exitwise Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "jinja2>=3.1.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
exitwise = "exitwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
markers = [
    "live: tests that hit external services (PyPI, Gemini API)",
]
